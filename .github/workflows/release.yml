name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release
        run: |
          cargo build --release --target ${{ matrix.target }} -p mos-cli -p mos-init

      - name: Package Artifacts
        run: |
          mkdir -p dist/mos-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/mos dist/mos-${{ github.ref_name }}-${{ matrix.target }}/
          cp target/${{ matrix.target }}/release/mos-init dist/mos-${{ github.ref_name }}-${{ matrix.target }}/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/mos-${{ github.ref_name }}-${{ matrix.target }}/
          cd dist
          tar -czvf mos-${{ github.ref_name }}-${{ matrix.target }}.tar.gz mos-${{ github.ref_name }}-${{ matrix.target }}
          sha256sum mos-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > mos-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
